<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>校园公文通 72 小时摘要</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css?v=10">
  </head>
  <body>
    <header class="topbar">
      <div class="shell topbar-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">通</span>
          <div>
            <p class="brand-title">校园公文通摘要</p>
            <p class="brand-subtitle">滚动 72 小时 · 自定义发文单位</p>
          </div>
        </div>

        <div class="session-area">
          <div class="session-status" id="sessionStatus" role="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="sessionStatusText">正在检查登录</span>
          </div>
          <button class="button button-secondary" id="loginButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"></path>
            </svg>
            <span>登录公文通</span>
          </button>
          <button class="icon-button danger-button" id="clearButton" type="button" aria-label="清除本机会话" title="清除本机会话">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="query-band">
        <div class="shell">
          <div class="query-heading">
            <div>
              <h1>近 72 小时通知</h1>
              <div class="unit-toolbar">
                <span id="selectedCount">已选 5 个单位</span>
                <button class="text-button" id="openDepartmentDialog" type="button">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 5v14M5 12h14"></path>
                  </svg>
                  <span>添加 / 管理单位</span>
                </button>
                <button class="text-button" id="resetDepartments" type="button">恢复默认</button>
              </div>
              <div class="selected-units" id="selectedUnits" aria-label="当前查询单位"></div>
            </div>
            <button class="button button-primary query-button" id="queryButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.5-3.5"></path>
              </svg>
              <span>查询近 72 小时</span>
            </button>
          </div>

          <div class="meta-strip">
            <span id="summaryMode">本地 DeepSeek · 一到两句</span>
            <span class="meta-divider" aria-hidden="true"></span>
            <span id="lastQueryText">尚未查询</span>
            <span class="meta-divider" aria-hidden="true"></span>
            <span id="windowText">查询时自动计算时间范围</span>
          </div>

          <div class="progress-wrap" id="progressWrap" hidden>
            <div class="progress-track" aria-hidden="true">
              <span id="progressBar"></span>
            </div>
            <p id="progressText" role="status" aria-live="polite"></p>
          </div>
        </div>
      </section>

      <section class="results-band">
        <div class="shell">
          <div class="results-toolbar">
            <div class="results-count">
              <strong id="resultCount">0</strong>
              <span>条通知</span>
            </div>
            <nav class="filter-tabs" id="filterTabs" aria-label="按发文单位筛选"></nav>
          </div>

          <div class="warning-list" id="warningList" aria-live="polite"></div>
          <div id="noticeList" class="notice-list" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <template id="emptyStateTemplate">
      <div class="empty-state">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 4h16v16H4zM8 9h8M8 13h5"></path>
          </svg>
        </div>
        <h2 id="emptyTitle"></h2>
        <p id="emptyMessage"></p>
      </div>
    </template>

    <template id="noticeTemplate">
      <article class="notice-item">
        <div class="notice-meta">
          <span class="department-badge"></span>
          <span class="category-label"></span>
          <span class="summary-label"></span>
        </div>
        <h2 class="notice-title">
          <a target="_blank" rel="noopener noreferrer">
            <span></span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            </svg>
          </a>
        </h2>
        <p class="notice-time"></p>
        <ul class="summary-list"></ul>
      </article>
    </template>

    <dialog class="login-dialog" id="loginDialog">
      <div class="dialog-header">
        <div>
          <p class="dialog-kicker">深圳大学统一身份认证</p>
          <h2>企业微信扫码登录</h2>
        </div>
        <button class="icon-button dialog-close" id="closeLoginDialog" type="button" aria-label="关闭登录窗口">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div class="qr-frame">
        <img id="loginQrImage" alt="深圳大学统一身份认证企业微信二维码">
      </div>
      <p class="dialog-help" id="loginDialogStatus">等待扫码</p>
      <button class="button button-secondary dialog-refresh" id="refreshLoginQr" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path>
        </svg>
        <span>刷新二维码</span>
      </button>
    </dialog>

    <dialog class="department-dialog" id="departmentDialog">
      <div class="dialog-header">
        <div>
          <p class="dialog-kicker">公文通发文单位</p>
          <h2>选择查询单位</h2>
        </div>
        <button class="icon-button dialog-close" id="closeDepartmentDialog" type="button" aria-label="关闭单位选择窗口">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <label class="department-search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input id="departmentSearch" type="search" placeholder="搜索发文单位" autocomplete="off">
      </label>
      <p class="dialog-help department-dialog-count" id="departmentDialogCount"></p>
      <div class="department-options" id="departmentOptions"></div>
      <div class="dialog-actions">
        <button class="button button-secondary" id="cancelDepartmentDialog" type="button">取消</button>
        <button class="button button-primary" id="saveDepartmentDialog" type="button">保存选择</button>
      </div>
    </dialog>

    <script type="module" src="/app.js?v=10"></script>
  </body>
</html>
